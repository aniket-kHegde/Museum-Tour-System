# device/device_config.yaml
# Generated by scripts/provision_device.py for each Pi.
# Edit manually for development.

device_id: "pi-dev-001"
museum_id: "demo-library"

mqtt:
  broker_host: "localhost"      # change to your broker IP/hostname (cloud VM static IP); or override with MQTT_BROKER_HOST env
  broker_port: 1883             # 8883 for TLS in production
  use_tls: false
  tls_ca_cert: ""
  tls_client_cert: ""
  tls_client_key: ""
  keepalive: 60
  device_password: ""           # broker password for user "device-{device_id}" when the broker has auth on; or pass MQTT_DEVICE_PASSWORD env (preferred, avoids storing secrets here)

ble:
  scan_interval_ms: 500         # scan every 500ms
  rssi_threshold: -70           # dBm; -70 ≈ 1-2m range
  debounce_seconds: 2.0         # minimum gap between same-beacon triggers
  beacon_type: "iBeacon"        # "iBeacon" or "Eddystone"

audio:
  input_device_index: 2         # sounddevice index; run `python -m sounddevice` to list (USB mic, NOT HDMI/headphones which have 0 in)
  sample_rate: 48000            # must match the device's native rate; USB cards are often fixed at 48000 (check `arecord -D hw:N,0 --dump-hw-params`)
  transmit_sample_rate: 16000   # downsample to this before publishing — keeps base64 WAV under the 512KB broker limit (mosquitto.conf); STT doesn't need >16k
  silence_threshold: 0.01       # RMS energy; lower = more sensitive
  silence_duration_ms: 1500     # stop recording after this much silence
  max_clip_seconds: 10.0        # cap clip length; STT runs server-side (Gemini)

camera:
  resolution: [1280, 720]
  jpeg_quality: 75
  max_payload_kb: 150           # resize if larger (MQTT message size limit)

buttons:
  enabled: true
  mic_pin: 17                   # BCM GPIO for "ask" button (mirrors SPACE) — physical pin 11
  camera_pin: 27                # BCM GPIO for "photo" button (mirrors C)  — physical pin 13
  pull_up: true                 # button wired between the GPIO pin and GND
  bounce_time: 0.05             # debounce seconds

tts:
  engine: "pyttsx3"             # "pyttsx3" (offline) or "gtts" (needs internet)
  rate: 150                     # words per minute
  voice_id: null                # null = system default voice

offline_cache:
  db_path: "/tmp/museum_cache.db"
  max_exhibits: 50
