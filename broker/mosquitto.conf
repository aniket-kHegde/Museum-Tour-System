# broker/mosquitto.conf
# Simple Mosquitto config for development (no TLS, password file auth)
# For production, switch to EMQX and enable TLS on port 8883.

listener 1883
listener 9001
protocol websockets

# Password auth (cloud / public broker). Generate the passwords file with:
#   docker run --rm -v "$PWD/broker:/work" eclipse-mosquitto:2.0 \
#     sh -c 'mosquitto_passwd -b -c /work/passwords service_account <password> && \
#            mosquitto_passwd -b /work/passwords device-pi-dev-001 <DEVICE_PASS>'
# For a purely-local LAN broker you can flip these back to: allow_anonymous true
allow_anonymous true
# password_file /mosquitto/config/passwords

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Keep retained messages (beacon content)
retain_available true

# Max payload 512KB (handles camera base64 images)
message_size_limit 524288
